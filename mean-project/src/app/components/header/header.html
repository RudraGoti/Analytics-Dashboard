<header class="header">

  <!-- LEFT -->
  <div class="header-left">

    <h2 class="page-title">
      {{ pageTitle }}
    </h2>

  </div>

  <!-- RIGHT -->
  <div class="header-right">

    <!-- DATE PICKER -->
    <div class="date-picker-container">
      <div class="date-display" (click)="toggleCalendar(); $event.stopPropagation()">
        <span class="material-icons calendar-icon-big">
          calendar_month
        </span>
        <span class="selected-date">
          <ng-container *ngIf="isRangeMode; else singleDateLabel">
            {{ formatRangeLabel(selectedRange) }}
          </ng-container>
          <ng-template #singleDateLabel>
            {{ selectedDate | date:'dd MMMM yyyy' }}
          </ng-template>
        </span>
      </div>

      <!-- Calendar Backdrop -->
      <div class="calendar-backdrop" *ngIf="showCalendar" (click)="showCalendar = false"></div>

      <div class="calendar-popup cal-card" *ngIf="showCalendar">
        <ng-container *ngIf="isRangeMode; else singleDatePopup">
          <div class="range-popup-header">
            <div class="range-popup-title">Select Date Range</div>
          </div>

          <div class="range-inputs">
            <label class="range-field cal-range-label">
              <span>From</span>
              <input class="cal-range-input" type="date" [(ngModel)]="fromDate" />
            </label>

            <label class="range-field cal-range-label">
              <span>To</span>
              <input class="cal-range-input" type="date" [(ngModel)]="toDate" />
            </label>
          </div>

          <button class="apply-btn cal-range-apply" type="button" (click)="applyDateRange()">
            Apply Range
          </button>
        </ng-container>

        <ng-template #singleDatePopup>
          <div class="calendar-header cal-head">
            <button class="calendar-nav-btn cal-nav" (click)="previousMonth()" type="button">
              <span class="material-icons">chevron_left</span>
            </button>
            <div class="calendar-month-year cal-month">
              {{ currentMonth | date:'MMMM yyyy' }}
            </div>
            <button class="calendar-nav-btn cal-nav" (click)="nextMonth()" type="button">
              <span class="material-icons">chevron_right</span>
            </button>
          </div>

          <div class="calendar-weekdays cal-weekdays">
            <div class="weekday cal-weekday" *ngFor="let day of weekDays">{{ day }}</div>
          </div>

          <div class="calendar-days cal-grid">
            <button
              *ngFor="let date of calendarDates"
              class="calendar-day cal-day"
              [class.other-month]="!isCurrentMonth(date)"
              [class.selected]="isSelectedDate(date)"
              [class.today]="isToday(date)"
              [disabled]="!isCurrentMonth(date)"
              (click)="$event.stopPropagation(); selectDate(date)"
              type="button"
            >
              {{ date.getDate() }}
            </button>
          </div>
        </ng-template>
      </div>
    </div>

    <!-- ICONS -->
    <span class="material-icons header-icon" role="button" tabindex="0" aria-label="Notifications" (click)="openNotifications()">
      notifications
    </span>

    <span class="material-icons header-icon">
      account_circle
    </span>

  </div>

</header>
